
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landed — find your people before you fly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16213E;
    --paper:#F3F5F7;
    --paper-2:#ffffff;
    --teal:#1F9C82;
    --amber:#E8A33D;
    --line:#C9CFD6;
    --line-soft:#DEE3E8;
    --font-display:'Fraunces', serif;
    --font-mono:'IBM Plex Mono', monospace;
    --font-body:'Inter', sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--paper); color:var(--ink); font-family:var(--font-body);
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  button{ font-family:inherit; }

  .screen{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:8vh 6vw; }
  .wordmark-standalone{
    font-family:var(--font-mono); font-weight:600; font-size:16px; letter-spacing:0.04em; margin-bottom:40px;
  }
  .wordmark-standalone span{ color:var(--teal); }

  .btn-primary{
    background:var(--ink); color:var(--paper-2); font-family:var(--font-mono);
    font-size:14px; padding:14px 26px; border-radius:8px; border:none; cursor:pointer;
    transition:background .2s;
  }
  .btn-primary:hover{ background:var(--teal); }
  .btn-primary:disabled{ opacity:0.6; cursor:default; }
  .btn-ghost{
    font-family:var(--font-mono); font-size:13px; background:none; border:1px solid var(--line);
    border-radius:999px; padding:10px 18px; cursor:pointer; color:var(--ink);
  }

  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .field label{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:#8892A6;
  }
  .field input{
    background:var(--paper); border:1px solid var(--line-soft); color:var(--ink);
    padding:12px 14px; border-radius:8px; font-family:var(--font-body); font-size:15px; width:100%;
  }
  .field input:focus{ outline:2px solid var(--teal); outline-offset:1px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .error-msg{ color:#C24A3B; font-size:13px; display:none; margin-top:8px; }
  .error-msg.show{ display:block; }

  /* Auth screen */
  .auth-card{
    background:var(--paper-2); border:1px solid var(--line-soft); border-radius:16px;
    padding:36px; max-width:400px; width:100%;
    box-shadow:0 20px 50px -25px rgba(22,33,62,0.25);
  }
  .auth-tabs{ display:flex; gap:8px; margin-bottom:24px; }
  .auth-tab{
    flex:1; font-family:var(--font-mono); font-size:13px; padding:10px 0; border-radius:999px;
    border:1px solid var(--line); background:none; cursor:pointer; color:var(--ink);
  }
  .auth-tab.active{ background:var(--ink); color:var(--paper-2); border-color:var(--ink); }

  /* Ticket / profile creation screen */
  .ticket-card-outer{
    background:var(--paper-2); border:1px solid var(--line-soft); border-radius:16px;
    padding:36px; max-width:460px; width:100%;
    box-shadow:0 20px 50px -25px rgba(22,33,62,0.25);
  }
  .ticket-intro{ font-size:14.5px; color:#4A5568; margin-bottom:24px; }

  /* Boarding pass card (used for reveal + mini version in app) */
  .pass{
    background:var(--paper-2); border-radius:14px; box-shadow:0 20px 50px -20px rgba(22,33,62,0.25);
    display:grid; grid-template-columns:1fr 90px; position:relative; overflow:hidden;
    border:1px solid var(--line-soft);
  }
  .pass-main{ padding:22px 20px; }
  .pass-row{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
  .pass-label{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:#8892A6; margin-bottom:4px; }
  .pass-value{ font-family:var(--font-display); font-size:18px; font-weight:600; }
  .route{ display:flex; align-items:center; gap:12px; margin:6px 0 16px; }
  .route .code{ font-family:var(--font-mono); font-size:24px; font-weight:600; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .route .path{ flex:1; height:1px; background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px); position:relative; }
  .route .path::after{ content:'✈'; position:absolute; right:0; top:-9px; font-size:14px; color:var(--teal); }
  .pass-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; border-top:1px dashed var(--line); padding-top:14px; }
  .pass-grid .pass-value{ font-size:13px; }
  .pass-stub{
    background:var(--ink); color:var(--paper); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px; position:relative;
  }
  .pass-stub::before{
    content:''; position:absolute; left:-7px; top:0; bottom:0; width:14px;
    background-image:radial-gradient(circle, var(--paper) 4px, transparent 4.5px);
    background-size:14px 14px; background-repeat:repeat-y;
  }
  .barcode{ writing-mode:vertical-rl; font-family:var(--font-mono); font-size:10px; letter-spacing:0.25em; opacity:0.8; }
  .stamp{
    font-family:var(--font-mono); font-size:9px; border:1px solid var(--amber); color:var(--amber);
    padding:3px 6px; border-radius:4px; transform:rotate(4deg);
  }

  /* Main app */
  .app-nav{
    width:100%; max-width:1100px; display:flex; justify-content:space-between; align-items:center;
    margin-bottom:36px; flex-wrap:wrap; gap:16px;
  }
  .wordmark{ font-family:var(--font-mono); font-weight:600; font-size:15px; }
  .wordmark span{ color:var(--teal); }
  .app-tabs{ display:flex; gap:8px; background:var(--paper-2); border:1px solid var(--line-soft); border-radius:999px; padding:4px; }
  .app-tab{
    font-family:var(--font-mono); font-size:13px; padding:9px 18px; border-radius:999px;
    border:none; background:none; cursor:pointer; color:#4A5568;
  }
  .app-tab.active{ background:var(--ink); color:var(--paper-2); }

  .app-panel{ width:100%; max-width:1100px; }
  .panel-heading{
    font-family:var(--font-display); font-size:20px; font-weight:600; margin:36px 0 18px;
  }
  .panel-heading:first-of-type{ margin-top:0; }

  .mini-pass{ max-width:420px; }

  .profile-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:18px; }
  .profile-card{
    background:var(--paper-2); border:1px solid var(--line-soft); border-radius:14px; padding:20px;
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px;
  }
  .avatar-img{ width:64px; height:64px; border-radius:50%; object-fit:cover; }
  .avatar-fallback{
    width:64px; height:64px; border-radius:50%; background:var(--teal); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:24px;
  }
  .profile-card-name{ font-weight:600; font-family:var(--font-display); font-size:16px; margin-top:6px; }
  .profile-card-uni{ font-size:12px; color:#8892A6; font-family:var(--font-mono); }
  .profile-card-dest{ font-size:12px; color:var(--teal); font-family:var(--font-mono); }
  .profile-card-bio{ font-size:13.5px; color:#4A5568; }
  .profile-msg-btn{ margin-top:8px; border:1px solid var(--line); border-radius:999px; padding:8px 18px; font-size:13px; background:none; cursor:pointer; }
  .empty-note{
    font-size:13.5px; color:#4A5568; background:var(--paper-2);
    border:1px dashed var(--line); border-radius:10px; padding:16px 18px; grid-column:1/-1;
  }
  .loading-note{ font-family:var(--font-mono); font-size:12px; color:#8892A6; }

  .chat-window{
    background:var(--paper-2); border:1px solid var(--line-soft); border-radius:14px;
    padding:16px; height:280px; overflow-y:auto; display:flex; flex-direction:column; gap:10px;
  }
  .msg-bubble{ max-width:75%; padding:10px 14px; border-radius:12px; background:var(--paper); align-self:flex-start; }
  .msg-bubble.mine{ background:var(--teal); color:#fff; align-self:flex-end; }
  .msg-author{ font-family:var(--font-mono); font-size:10px; opacity:0.7; margin-bottom:2px; }
  .msg-content{ font-size:14px; }
  .chat-input-row{ display:flex; gap:10px; margin-top:12px; }
  .chat-input-row input{
    flex:1; background:var(--paper-2); border:1px solid var(--line-soft); border-radius:8px;
    padding:12px 14px; font-family:var(--font-body); font-size:14px;
  }

  .chat-modal{
    position:fixed; inset:0; background:rgba(22,33,62,0.5); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .chat-modal-inner{ background:var(--paper); border-radius:14px; padding:24px; max-width:480px; width:100%; }
  .chat-modal-header{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;
    font-family:var(--font-display); font-weight:600; font-size:18px;
  }
  .chat-modal-header button{ background:none; border:none; font-size:18px; cursor:pointer; }

  .top-error{
    max-width:400px; width:100%; background:#FDEAE6; border:1px solid #F0B8AC; color:#9A3B2C;
    border-radius:10px; padding:12px 16px; font-size:13.5px; margin-bottom:20px; display:none;
  }
  .top-error.show{ display:block; }

  @media (max-width:640px){
    .row2{ grid-template-columns:1fr; }
    .auth-card, .ticket-card-outer{ padding:26px; }
  }
</style>
</head>
<body>

<div id="app">

  <!-- AUTH SCREEN -->
  <div id="screenAuth" class="screen">
    <div class="wordmark-standalone">LAND<span>ED</span></div>
    <div class="top-error" id="loadError">Couldn't connect right now — try refreshing the page.</div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-tab="signin">Log in</button>
        <button type="button" class="auth-tab" data-tab="signup">Create account</button>
      </div>
      <form id="authForm">
        <div class="field">
          <label for="authEmail">Email</label>
          <input id="authEmail" type="email" required placeholder="you@youruni.edu">
        </div>
        <div class="field">
          <label for="authPassword">Password</label>
          <input id="authPassword" type="password" required minlength="6" placeholder="At least 6 characters">
        </div>
        <button type="submit" class="btn-primary" id="authSubmitBtn" style="width:100%;">Log in</button>
        <div class="error-msg" id="authError"></div>
      </form>
    </div>
  </div>

  <!-- TICKET / PROFILE CREATION SCREEN -->
  <div id="screenTicket" class="screen" style="display:none;">
    <div class="wordmark-standalone">LAND<span>ED</span></div>
    <div class="ticket-card-outer">
      <p class="ticket-intro">One profile, one destination — this is your boarding pass into the community. Add a photo so people recognize you.</p>
      <form id="profileForm">
        <div class="field">
          <label for="avatarInput">Profile photo</label>
          <input id="avatarInput" type="file" accept="image/*">
        </div>
        <div class="row2">
          <div class="field">
            <label for="pName">Name</label>
            <input id="pName" required>
          </div>
          <div class="field">
            <label for="pUniversity">University</label>
            <input id="pUniversity" required>
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label for="pDestination">Destination</label>
            <input id="pDestination" required placeholder="Madrid">
          </div>
          <div class="field">
            <label>Dates</label>
            <div style="display:flex; gap:8px;">
              <input id="pStart" type="date" required>
              <input id="pEnd" type="date" required>
            </div>
          </div>
        </div>
        <div class="field">
          <label for="pBio">About you</label>
          <input id="pBio" placeholder="A line about you — interests, why you're going, whatever">
        </div>
        <button type="submit" class="btn-primary" id="profileSubmitBtn" style="width:100%;">Create my boarding pass</button>
        <div class="error-msg" id="profileError"></div>
      </form>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="screenMain" class="screen" style="align-items:stretch; display:none;">
    <nav class="app-nav">
      <div class="wordmark">LAND<span>ED</span></div>
      <div class="app-tabs">
        <button type="button" class="app-tab active" data-tab="communities">Your Community</button>
        <button type="button" class="app-tab" data-tab="findpeople">Find People</button>
      </div>
      <button type="button" id="logoutBtn" class="btn-ghost">Log out</button>
    </nav>

    <div id="panelCommunities" class="app-panel">
      <div class="mini-pass" id="miniPass"></div>

      <h3 class="panel-heading">People heading to your destination</h3>
      <div class="profile-grid" id="communityGrid"><div class="loading-note">Loading…</div></div>

      <h3 class="panel-heading">Group chat</h3>
      <div class="chat-window" id="groupChatWindow"></div>
      <form id="groupChatForm" class="chat-input-row">
        <input id="groupChatInput" type="text" placeholder="Say hi to your cohort…" required>
        <button type="submit" class="btn-primary">Send</button>
      </form>
    </div>

    <div id="panelFindPeople" class="app-panel" style="display:none;">
      <h3 class="panel-heading">Everyone on Landed</h3>
      <div class="profile-grid" id="allProfilesGrid"><div class="loading-note">Loading…</div></div>
    </div>
  </div>

</div>

<div class="chat-modal" id="chatModal" style="display:none;">
  <div class="chat-modal-inner">
    <div class="chat-modal-header">
      <span id="chatModalName"></span>
      <button type="button" id="chatModalClose">✕</button>
    </div>
    <div class="chat-window" id="dmChatWindow"></div>
    <form id="dmChatForm" class="chat-input-row">
      <input id="dmChatInput" type="text" placeholder="Type a message…" required>
      <button type="submit" class="btn-primary">Send</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  const SUPABASE_URL = 'https://zsiwnivfmdnikqwslycv.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Z0yKOoePcsR7InFWIuIcCg_vNOjlZjZ';

  if(typeof supabase === 'undefined' || !supabase.createClient){
    document.getElementById('loadError').textContent = 'Failed to load required scripts — check your internet connection and refresh.';
    document.getElementById('loadError').classList.add('show');
    return;
  }
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let currentProfile = null;
  let activeDmUser = null;
  let activeConversationId = null;
  let groupChatInterval = null;
  let dmChatInterval = null;

  const screenAuth = document.getElementById('screenAuth');
  const screenTicket = document.getElementById('screenTicket');
  const screenMain = document.getElementById('screenMain');
  const loadError = document.getElementById('loadError');

  function code(str, len){
    if(!str) return '???';
    const words = str.trim().split(/\s+/);
    if(words.length > 1){ return words.map(w => w[0]).join('').toUpperCase().slice(0, len || 4); }
    return str.trim().toUpperCase().slice(0, len || 3);
  }
  function formatDateRange(start, end){
    const opts = { month: 'short', day: 'numeric' };
    try{
      const s = new Date(start + 'T00:00:00').toLocaleDateString('en-US', opts);
      const e = new Date(end + 'T00:00:00').toLocaleDateString('en-US', opts);
      return s + ' – ' + e;
    }catch(e){ return 'TBD'; }
  }
  function datesOverlap(aStart, aEnd, bStart, bEnd){
    if(!aStart || !aEnd || !bStart || !bEnd) return true;
    return new Date(aStart) <= new Date(bEnd) && new Date(bStart) <= new Date(aEnd);
  }
  function renderPassCard(profile){
    return '<div class="pass"><div class="pass-main">' +
      '<div class="pass-row"><div><div class="pass-label">Passenger</div><div class="pass-value">' + profile.name + '</div></div><div class="stamp">CONFIRMED</div></div>' +
      '<div class="route"><div class="code">' + code(profile.university, 4) + '</div><div class="path"></div><div class="code">' + code(profile.destination, 3) + '</div></div>' +
      '<div class="pass-grid">' +
        '<div><div class="pass-label">University</div><div class="pass-value" style="font-size:13px;">' + profile.university + '</div></div>' +
        '<div><div class="pass-label">Destination</div><div class="pass-value" style="font-size:13px;">' + profile.destination + '</div></div>' +
        '<div><div class="pass-label">Dates</div><div class="pass-value" style="font-size:13px;">' + formatDateRange(profile.start_date, profile.end_date) + '</div></div>' +
      '</div></div><div class="pass-stub"><div class="barcode">LANDED-2027</div><div class="stamp" style="transform:rotate(-4deg);">✈</div></div></div>';
  }

  // ---------- AUTH ----------
  const authTabs = document.querySelectorAll('.auth-tab');
  const authForm = document.getElementById('authForm');
  const authSubmitBtn = document.getElementById('authSubmitBtn');
  const authError = document.getElementById('authError');
  let authMode = 'signin';

  authTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      authTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      authMode = tab.dataset.tab;
      authSubmitBtn.textContent = authMode === 'signin' ? 'Log in' : 'Create account';
      authError.classList.remove('show');
    });
  });

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    authError.classList.remove('show');
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    authSubmitBtn.disabled = true;
    authSubmitBtn.textContent = authMode === 'signin' ? 'Logging in…' : 'Creating account…';
    try{
      const result = authMode === 'signin'
        ? await sb.auth.signInWithPassword({ email, password })
        : await sb.auth.signUp({ email, password });
      if(result.error) throw result.error;
      if(authMode === 'signup' && !result.data.session){
        authError.textContent = 'Account created. Check your email to confirm it, then log in.';
        authError.classList.add('show');
      }
      // onAuthStateChange below handles the redirect once a session exists
    }catch(err){
      console.error('Auth error:', err);
      authError.textContent = err.message || 'Something went wrong.';
      authError.classList.add('show');
    }finally{
      authSubmitBtn.disabled = false;
      authSubmitBtn.textContent = authMode === 'signin' ? 'Log in' : 'Create account';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
  });

  sb.auth.onAuthStateChange((_event, session) => { handleSession(session); });

  async function handleSession(session){
    currentUser = session ? session.user : null;
    if(groupChatInterval){ clearInterval(groupChatInterval); groupChatInterval = null; }
    if(dmChatInterval){ clearInterval(dmChatInterval); dmChatInterval = null; }

    if(!currentUser){
      screenAuth.style.display = 'flex';
      screenTicket.style.display = 'none';
      screenMain.style.display = 'none';
      return;
    }
    await loadOwnProfile();
  }

  async function loadOwnProfile(){
    const { data, error } = await sb.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
    if(error){ console.error('Load profile error:', error); return; }
    currentProfile = data;
    if(!currentProfile){
      screenAuth.style.display = 'none';
      screenTicket.style.display = 'flex';
      screenMain.style.display = 'none';
    }else{
      screenAuth.style.display = 'none';
      screenTicket.style.display = 'none';
      screenMain.style.display = 'flex';
      document.getElementById('miniPass').innerHTML = renderPassCard(currentProfile);
      loadCommunity();
      loadAllProfiles();
      startGroupChat();
    }
  }

  // ---------- PROFILE / TICKET CREATION ----------
  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const profileError = document.getElementById('profileError');
    profileError.classList.remove('show');
    const btn = document.getElementById('profileSubmitBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try{
      let avatarUrl = null;
      const file = document.getElementById('avatarInput').files[0];
      if(file){
        const path = currentUser.id + '/avatar-' + Date.now();
        const { error: uploadError } = await sb.storage.from('avatars').upload(path, file, { upsert: true });
        if(uploadError) throw uploadError;
        const { data: urlData } = sb.storage.from('avatars').getPublicUrl(path);
        avatarUrl = urlData.publicUrl;
      }
      const profileData = {
        id: currentUser.id,
        name: document.getElementById('pName').value.trim(),
        university: document.getElementById('pUniversity').value.trim(),
        destination: document.getElementById('pDestination').value.trim(),
        start_date: document.getElementById('pStart').value,
        end_date: document.getElementById('pEnd').value,
        bio: document.getElementById('pBio').value.trim(),
        avatar_url: avatarUrl
      };
      const { error: upsertError } = await sb.from('profiles').upsert(profileData);
      if(upsertError) throw upsertError;

      currentProfile = profileData;
      screenTicket.style.display = 'none';
      screenMain.style.display = 'flex';
      document.getElementById('miniPass').innerHTML = renderPassCard(currentProfile);
      loadCommunity();
      loadAllProfiles();
      startGroupChat();
    }catch(err){
      console.error('Profile save error:', err);
      profileError.textContent = err.message || 'Something went wrong.';
      profileError.classList.add('show');
    }finally{
      btn.disabled = false;
      btn.textContent = 'Create my boarding pass';
    }
  });

  // ---------- APP TABS ----------
  document.querySelectorAll('.app-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.app-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const isCommunities = tab.dataset.tab === 'communities';
      document.getElementById('panelCommunities').style.display = isCommunities ? 'block' : 'none';
      document.getElementById('panelFindPeople').style.display = isCommunities ? 'none' : 'block';
    });
  });

  // ---------- YOUR COMMUNITY: matches ----------
  async function loadCommunity(){
    const grid = document.getElementById('communityGrid');
    grid.innerHTML = '<div class="loading-note">Loading…</div>';
    const { data, error } = await sb.from('profiles').select('*').ilike('destination', currentProfile.destination);
    if(error){ grid.innerHTML = '<div class="empty-note">Couldn\'t load people right now.</div>'; return; }
    const others = data.filter(p => p.id !== currentUser.id && datesOverlap(currentProfile.start_date, currentProfile.end_date, p.start_date, p.end_date));
    renderProfileGrid(grid, others, 'Nobody else here yet with matching dates. Share your link to bring more people.');
  }

  // ---------- FIND PEOPLE: everyone ----------
  async function loadAllProfiles(){
    const grid = document.getElementById('allProfilesGrid');
    grid.innerHTML = '<div class="loading-note">Loading…</div>';
    const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false }).limit(100);
    if(error){ grid.innerHTML = '<div class="empty-note">Couldn\'t load people right now.</div>'; return; }
    const others = data.filter(p => p.id !== currentUser.id);
    renderProfileGrid(grid, others, 'Nobody else has joined yet — be the first to spread the word.');
  }

  function renderProfileGrid(grid, people, emptyText){
    if(people.length === 0){
      grid.innerHTML = '<div class="empty-note">' + emptyText + '</div>';
      return;
    }
    grid.innerHTML = people.map(p => {
      const avatar = p.avatar_url
        ? '<img src="' + p.avatar_url + '" class="avatar-img">'
        : '<div class="avatar-fallback">' + (p.name || '?').charAt(0).toUpperCase() + '</div>';
      return '<div class="profile-card">' + avatar +
        '<div class="profile-card-name">' + p.name + '</div>' +
        '<div class="profile-card-uni">' + p.university + '</div>' +
        '<div class="profile-card-dest">→ ' + p.destination + '</div>' +
        (p.bio ? '<div class="profile-card-bio">' + p.bio + '</div>' : '') +
        '<button type="button" class="profile-msg-btn" data-id="' + p.id + '" data-name="' + p.name.replace(/"/g,'&quot;') + '">Message</button>' +
        '</div>';
    }).join('');
    grid.querySelectorAll('.profile-msg-btn').forEach(btn => {
      btn.addEventListener('click', () => openDm(btn.dataset.id, btn.dataset.name));
    });
  }

  // ---------- GROUP CHAT ----------
  function startGroupChat(){
    loadGroupChat();
    if(groupChatInterval) clearInterval(groupChatInterval);
    groupChatInterval = setInterval(loadGroupChat, 4000);
  }
  async function loadGroupChat(){
    const win = document.getElementById('groupChatWindow');
    const { data, error } = await sb.from('destination_messages')
      .select('*, profiles:sender_id(name)')
      .ilike('destination', currentProfile.destination)
      .order('created_at', { ascending: true }).limit(100);
    if(error){ console.error('Group chat load error:', error); return; }
    win.innerHTML = data.map(m => renderBubble(m.profiles ? m.profiles.name : '?', m.content, m.sender_id === currentUser.id)).join('');
    win.scrollTop = win.scrollHeight;
  }
  document.getElementById('groupChatForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('groupChatInput');
    const content = input.value.trim();
    if(!content) return;
    input.value = '';
    const { error } = await sb.from('destination_messages').insert({
      destination: currentProfile.destination, sender_id: currentUser.id, content
    });
    if(error) console.error('Group chat send error:', error);
    loadGroupChat();
  });

  // ---------- 1:1 CHAT ----------
  async function openDm(otherId, otherName){
    activeDmUser = { id: otherId, name: otherName };
    document.getElementById('chatModalName').textContent = otherName;
    document.getElementById('chatModal').style.display = 'flex';
    await ensureConversation(otherId);
    loadDmChat();
    if(dmChatInterval) clearInterval(dmChatInterval);
    dmChatInterval = setInterval(loadDmChat, 3000);
  }
  async function ensureConversation(otherId){
    const userA = currentUser.id < otherId ? currentUser.id : otherId;
    const userB = currentUser.id < otherId ? otherId : currentUser.id;
    let { data, error } = await sb.from('conversations').select('*').eq('user_a', userA).eq('user_b', userB).maybeSingle();
    if(error) console.error('Find conversation error:', error);
    if(!data){
      const { data: created, error: createError } = await sb.from('conversations').insert({ user_a: userA, user_b: userB }).select().single();
      if(createError){ console.error('Create conversation error:', createError); return; }
      data = created;
    }
    activeConversationId = data.id;
  }
  async function loadDmChat(){
    if(!activeConversationId) return;
    const win = document.getElementById('dmChatWindow');
    const { data, error } = await sb.from('messages').select('*').eq('conversation_id', activeConversationId).order('created_at', { ascending: true }).limit(200);
    if(error){ console.error('DM load error:', error); return; }
    win.innerHTML = data.map(m => renderBubble(m.sender_id === currentUser.id ? 'You' : activeDmUser.name, m.content, m.sender_id === currentUser.id)).join('');
    win.scrollTop = win.scrollHeight;
  }
  document.getElementById('dmChatForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('dmChatInput');
    const content = input.value.trim();
    if(!content || !activeConversationId) return;
    input.value = '';
    const { error } = await sb.from('messages').insert({ conversation_id: activeConversationId, sender_id: currentUser.id, content });
    if(error) console.error('DM send error:', error);
    loadDmChat();
  });
  document.getElementById('chatModalClose').addEventListener('click', () => {
    document.getElementById('chatModal').style.display = 'none';
    if(dmChatInterval) clearInterval(dmChatInterval);
  });

  function renderBubble(name, content, isMine){
    const safe = content.replace(/</g,'&lt;');
    return '<div class="msg-bubble ' + (isMine ? 'mine' : '') + '"><div class="msg-author">' + (isMine ? 'You' : name) + '</div><div class="msg-content">' + safe + '</div></div>';
  }

  // ---------- INIT ----------
  sb.auth.getSession().then(({ data, error }) => {
    if(error){
      loadError.textContent = 'Failed to check your session — try refreshing.';
      loadError.classList.add('show');
    }
    handleSession(data.session);
  }).catch(err => {
    console.error('Init error:', err);
    loadError.textContent = 'Failed to connect — try refreshing the page.';
    loadError.classList.add('show');
  });
})();
</script>

</body>
</html>
